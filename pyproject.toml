[project]
name = "yabbe-mcp"
version = "0.1.0"
description = "MCP server for the YABBE video editor: let any AI agent edit videos"
readme = "README.md"
authors = [
    { name = "natyavidhan", email = "natyavidhanbiswas10@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pillow>=12.3.0",
]

[project.scripts]
yabbe-mcp = "yabbe_mcp:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
